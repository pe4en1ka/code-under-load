name: Check extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Check syntax on Linux
        if: runner.os != 'Windows'
        run: npm run check
        shell: bash
      - name: Test on Linux
        if: runner.os != 'Windows'
        run: npm test
        shell: bash
      - name: Check syntax on Windows
        if: runner.os == 'Windows'
        run: npm run check
        shell: msys2 {0}
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: npm test
        shell: msys2 {0}
